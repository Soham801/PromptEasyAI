name: Quality

on:
  push:
  pull_request:

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m pytest -q tests
      - name: Run benchmark comparison gate
        run: python -m prompteasy.cli benchmark --compare offline:offline-baseline --compare offline:offline-candidate --output reports/benchmark-comparison.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports/benchmark-comparison.json