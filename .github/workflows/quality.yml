name: Quality

on:
  push:
  pull_request:

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    env:
      PROMPTEASY_ENV: development
      PROMPTEASY_PROVIDER: offline
      PROMPTEASY_MODEL: offline-model
      PROMPTEASY_RUN_LIVE_GROQ: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.21"
          enable-cache: true
      - name: Install package
        run: uv sync --locked
      - name: Run tests
        run: uv run python -m pytest -q tests --tb=short -ra --junitxml=test-results.xml
      - name: Run benchmark comparison gate
        run: uv run python -m prompteasy.cli benchmark --compare offline:offline-baseline --compare offline:offline-candidate --output reports/benchmark-comparison.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports/benchmark-comparison.json